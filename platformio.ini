[platformio]
default_envs = jc3636w518c

[env]
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5

[esp32]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = pre:tools/build_identity.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DADBLOCK_PROFILE_C3=1

[env:round-display]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DROUND_DISPLAY=1
    -DADBLOCK_PROFILE_ROUND=1
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.2.7

[env:s3-headless]
extends = esp32
board = jc3636w518c
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions-s3.csv
build_flags =
    ${esp32.build_flags}
    -DBOARD_HAS_PSRAM
    -DADBLOCK_PROFILE_S3_HEADLESS=1

[env:jc3636w518c]
extends = env:s3-headless
build_flags =
    ${env:s3-headless.build_flags}
    -DROUND_DISPLAY=1
    -DROUND_DISPLAY_S3=1
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.2.7

[env:native]
platform = native
test_build_src = no
build_flags = -std=c++11 -Isrc
